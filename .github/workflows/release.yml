name: Release IPA and APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CI: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate tag, credentials, and release configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_SERVICE_TERMS_URL: ${{ vars.EXPO_PUBLIC_SERVICE_TERMS_URL }}
          EXPO_PUBLIC_PRIVACY_TERMS_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_TERMS_URL }}
          EXPO_PUBLIC_LOCATION_TERMS_URL: ${{ vars.EXPO_PUBLIC_LOCATION_TERMS_URL }}
        run: node scripts/release.mjs prepare
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Install pinned EAS CLI
        run: npm install --global eas-cli@24.8.0 --no-audit --no-fund
      - name: Build both signed applications on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform all --profile release --non-interactive --wait --json \
            --message "GitHub Release $RELEASE_TAG" > dist-release/eas-builds.json
      - name: Download and verify APK and IPA
        run: node scripts/release.mjs collect
      - name: Retain verified binaries for recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            dist-release/*.apk
            dist-release/*.ipa
            dist-release/SHA256SUMS
            dist-release/release-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release after both artifacts are verified
        run: node scripts/release.mjs publish
